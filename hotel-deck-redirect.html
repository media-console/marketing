<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Hotel Performance Marketing Deck</title>
<style>html,body{margin:0;background:#fff;font-family:Arial,sans-serif}.fallback{position:fixed;inset:0;display:grid;place-items:center;color:#667085;font-size:14px}.fallback a{color:#1159f8;font-weight:700}</style>
</head>
<body>
<div class="fallback">Opening deck&hellip;&nbsp;<a id="open" href="#">Open now</a></div>
<script>
function decode64(value){try{const normalized=(value||'').replace(/-/g,'+').replace(/_/g,'/'),padded=normalized+'='.repeat((4-normalized.length%4)%4),bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}catch(_){return''}}
function decodeJson64(value){try{return JSON.parse(decode64(value)||'{}')}catch(_){return{}}}
function encode64(value){const bytes=new TextEncoder().encode(value);let binary='';bytes.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function browserName(ua){if(/Edg\//.test(ua))return'Edge';if(/OPR\//.test(ua))return'Opera';if(/SamsungBrowser\//.test(ua))return'Samsung Internet';if(/Chrome\//.test(ua))return'Chrome';if(/Firefox\//.test(ua))return'Firefox';if(/Safari\//.test(ua))return'Safari';return'Other'}
function osName(ua){if(/Windows NT/.test(ua))return'Windows';if(/iPhone|iPad|iPod/.test(ua))return'iOS / iPadOS';if(/Android/.test(ua))return'Android';if(/Mac OS X/.test(ua))return'macOS';if(/Linux/.test(ua))return'Linux';return'Other'}
function deviceName(ua){if(/iPad|Tablet|Android(?!.*Mobile)/i.test(ua))return'Tablet';if(/Mobile|iPhone|iPod|Android/i.test(ua))return'Mobile';return'Desktop'}
function eventId(){return(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
const q=new URLSearchParams(location.search),DEST=decode64(q.get('d')),TRACKER=decode64(q.get('t')),PAYLOAD=q.get('p')||'',META=decodeJson64(PAYLOAD);
const valid=/^https?:\/\//i;document.getElementById('open').href=valid.test(DEST)?DEST:'#';
function go(){if(valid.test(DEST))location.replace(DEST)}
async function geoData(){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1200);const response=await fetch('https://ipapi.co/json/',{cache:'no-store',signal:controller.signal});clearTimeout(timer);return response.ok?await response.json():{}}catch(_){return{}}}
(async()=>{if(!valid.test(DEST)){document.body.textContent='Invalid deck link.';return}if(!valid.test(TRACKER)||!PAYLOAD){go();return}const ua=navigator.userAgent||'',geo=await geoData(),logUrl=new URL(TRACKER);logUrl.searchParams.set('action','trackDeckClick');logUrl.searchParams.set('event_id',eventId());logUrl.searchParams.set('recipient_email',META.recipientEmail||'');logUrl.searchParams.set('recipient_name',META.recipientName||'');logUrl.searchParams.set('hotel_name',META.hotelName||'');logUrl.searchParams.set('email_language',META.emailLanguage||'');logUrl.searchParams.set('button',META.button||'Hotel Performance Marketing Deck');logUrl.searchParams.set('destination_url',DEST);logUrl.searchParams.set('ip',geo.ip||'');logUrl.searchParams.set('country',geo.country_name||'');logUrl.searchParams.set('city',geo.city||'');logUrl.searchParams.set('region',geo.region||'');logUrl.searchParams.set('org',geo.org||'');logUrl.searchParams.set('timezone',geo.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'');logUrl.searchParams.set('device_type',deviceName(ua));logUrl.searchParams.set('browser',browserName(ua));logUrl.searchParams.set('os',osName(ua));logUrl.searchParams.set('language',navigator.language||'');logUrl.searchParams.set('traffic_source','Email Outreach');logUrl.searchParams.set('referrer',document.referrer||'');logUrl.searchParams.set('user_agent',ua);logUrl.searchParams.set('screen',(screen.width||'')+'x'+(screen.height||''));const request=fetch(logUrl.href,{method:'GET',mode:'no-cors',cache:'no-store',keepalive:true}).catch(()=>{});await Promise.race([request,new Promise(resolve=>setTimeout(resolve,1800))]);go()})();
</script>
</body>
</html>
